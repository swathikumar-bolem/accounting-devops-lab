server.port=8080
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:accounting}
spring.datasource.username=${DB_USERNAME:accounting_user}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-please-1234567890}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@example.com}
app.bootstrap.admin-password=${ADMIN_PASSWORD:Admin@123}
app.bootstrap.business-name=${BUSINESS_NAME:Demo Accounting Company}
